<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Emetco</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f6f9; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
<script>
  // ⚠️ ضع هنا رابط النشر (Web app URL) المنتهي بـ /exec
  const BASE = 'https://script.google.com/macros/s/AKfycbwDYu9lNwh0MBSfo_H10TaV2IwvyJws8glQMbIC3UOE6Nf2MOeR5NHmLs0s6PrhJVcNUg/exec';

  // يمرّر أي باراميترات (مثل ?page=admin) إلى التطبيق
  const frame = document.createElement('iframe');
  frame.src = BASE + location.search;
  frame.setAttribute('allow', 'clipboard-write; fullscreen');
  document.body.appendChild(frame);
</script>
</body>
</html>
